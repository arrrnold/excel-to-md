<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convierte datos de Excel a Markdown. 100% privado.">
    <title>Excel to Markdown</title>
    <link rel="stylesheet" href="./vendor/pico.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <!-- Barra superior: titulo + acciones -->
    <nav class="container-fluid">
        <ul><li><strong>Excel to Markdown</strong></li></ul>
        <ul>
            <li><small id="status-msg" class="status-text">Listo</small></li>
            <li><button id="convert-btn" class="btn-sm"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Convertir</button></li>
            <li><button id="clear-btn" class="secondary outline btn-sm">Limpiar</button></li>
            <li>
                <label for="file-input" class="file-label">
                    Subir archivo
                    <input type="file" id="file-input" accept=".xlsx,.xls,.xlsm,.csv" hidden>
                </label>
            </li>
        </ul>
    </nav>

    <main class="container">
        <div class="app-layout">

            <!-- Columna izquierda: paste + output -->
            <div class="main-col">

                <!-- Zona de pegado -->
                <div id="paste-zone" role="textbox" contenteditable="true" aria-label="Pega aqui tu rango de Excel" tabindex="0"></div>

                <!-- Output (aparece tras convertir) -->
                <section id="output-section" class="hidden">
                    <div class="md-bar">
                        <span class="md-bar-title">Markdown</span>
                        <span class="md-bar-actions">
                            <button id="copy-btn" class="btn-sm">Copiar</button>
                            <button id="download-btn" class="secondary outline btn-sm">Descargar .md</button>
                        </span>
                    </div>
                    <textarea id="markdown-output" spellcheck="false" readonly rows="14"></textarea>

                    <details class="preview-details">
                        <summary>Ver tabla renderizada</summary>
                        <div id="preview-container" class="preview-scroll"></div>
                    </details>
                </section>
            </div>

            <!-- Columna derecha: configuracion -->
            <aside class="config-col">
                <h4 class="config-title">Configuracion</h4>

                <fieldset>
                    <legend>Estructura</legend>
                    <label><input type="checkbox" id="opt-header" checked> Primera fila = encabezado</label>
                    <label><input type="checkbox" id="opt-merges" checked> Propagar celdas combinadas</label>
                    <label><input type="checkbox" id="opt-blanks"> Preservar filas vacias</label>
                </fieldset>

                <fieldset>
                    <legend>Formato</legend>
                    <label><input type="checkbox" id="opt-compact"> Tabla compacta</label>
                    <label><input type="checkbox" id="opt-pipe-html"> Escape pipe como &amp;#124;</label>
                </fieldset>

                <fieldset>
                    <legend>Fecha</legend>
                    <select id="opt-date-format">
                        <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                        <option value="DD/MM/YYYY">DD/MM/YYYY</option>
                        <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                    </select>
                </fieldset>

                <fieldset id="sheet-selector-container" class="hidden">
                    <legend>Hojas</legend>
                    <div id="sheet-checkboxes"></div>
                </fieldset>
            </aside>
        </div>
    </main>

    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./js/converter.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
