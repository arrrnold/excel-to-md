<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Excel to Markdown - Convertidor profesional con alineación visual perfecta.">
    <title>Excel to Markdown | Professional Edition</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="container header-flex">
            <div>
                <h1>Excel <span class="accent">→</span> Markdown</h1>
                <p class="subtitle">Pega desde Excel o arrastra archivos. Alineación visual perfecta.</p>
            </div>
            <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema">
                <svg id="sun-icon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main class="container">
        <div id="status-msg" class="status-msg">Listo.</div>

        <section class="input-section">
            <div id="paste-zone" class="paste-zone" role="textbox" contenteditable="true"></div>
            <div id="dropzone" class="dropzone" onclick="document.getElementById('file-input').click()">
                <p>Haz clic para subir <strong>.xlsx / .csv</strong></p>
                <input type="file" id="file-input" accept=".xlsx,.xls,.xlsm,.csv" class="hidden">
            </div>
        </section>

        <!-- Configuración Completa -->
        <details class="options-panel" open>
            <summary>Configuración y Filtros Avanzados</summary>
            <div class="options-grid">
                <div class="opt-group">
                    <h4>Estructura</h4>
                    <label class="checkbox-label"><input type="checkbox" id="opt-header" checked> Primera fila es encabezado</label>
                    <label class="checkbox-label"><input type="checkbox" id="opt-merges" checked> Propagar valores en merges</label>
                    <label class="checkbox-label"><input type="checkbox" id="opt-blanks"> Preservar filas vacías</label>
                </div>
                
                <div class="opt-group">
                    <h4>Formato MD</h4>
                    <label class="checkbox-label"><input type="checkbox" id="opt-compact"> Tabla compacta (sin padding)</label>
                    <label class="checkbox-label"><input type="checkbox" id="opt-pipe-html"> Escape pipe como &amp;#124;</label>
                </div>

                <div class="opt-group">
                    <h4>Localización</h4>
                    <div class="select-label">
                        <span>Formato Fecha:</span>
                        <select id="opt-date-format">
                            <option value="YYYY-MM-DD">YYYY-MM-DD (ISO)</option>
                            <option value="DD/MM/YYYY">DD/MM/YYYY</option>
                            <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                        </select>
                    </div>
                </div>

                <div id="sheet-selector-container" class="opt-group hidden">
                    <h4>Hojas</h4>
                    <div id="sheet-checkboxes" class="sheet-list"></div>
                </div>
            </div>
        </details>

        <section id="output-section" class="hidden output-area">
            <div class="header-flex">
                <h2>Markdown Generado</h2>
                <div class="actions">
                    <button id="copy-btn" class="btn btn-primary">Copiar Markdown</button>
                    <button id="download-btn" class="btn btn-secondary">Descargar .md</button>
                </div>
            </div>
            
            <div class="output-grid">
                <div class="editor-pane">
                    <textarea id="markdown-output" spellcheck="false" readonly></textarea>
                </div>
                <div class="preview-pane">
                    <div id="preview-container" class="preview-scroll"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./js/converter.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
